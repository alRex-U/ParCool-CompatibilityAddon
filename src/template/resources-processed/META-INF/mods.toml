modLoader = "javafml"
loaderVersion = "${loader.version_range}"
license = "GNU LESSER GENERAL PUBLIC LICENSE VERSION 3"
[[mods]]
modId = "parcool_compat_addon"
version = "${mod.version}"
displayName = "${mod.name}"
description = '''
An addon for ParCool, which support compatibility of animation with some mods
'''
[[dependencies.parcool_compat_addon]]
modId = "forge"
mandatory = true
versionRange = "${forge.version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.parcool_compat_addon]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft.version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.parcool_compat_addon]]
modId = "parcool"
mandatory = true
versionRange = "${parcool.version_range}"
ordering = "BEFORE"
side = "BOTH"
[[dependencies.parcool_compat_addon]]
modId = "tacz"
mandatory = false
